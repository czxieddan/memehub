[workspace]
members = [".", "crates/modular-db-api", "crates/meme-github", "crates/meme-core", "crates/meme-cli", "crates/meme-web"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-AHCL-1.2"
repository = "https://github.com/czxieddan/memehub"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "query"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
http = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
tempfile = "3"
rnmdb-cli = { git = "https://github.com/czxieddan/RNovModularDB", rev = "018eaa0fbe8caf779ee6c90c8343c97da8b281e5" }
rnmdb-storage = { git = "https://github.com/czxieddan/RNovModularDB", rev = "018eaa0fbe8caf779ee6c90c8343c97da8b281e5" }
rnmdb-types = { git = "https://github.com/czxieddan/RNovModularDB", rev = "018eaa0fbe8caf779ee6c90c8343c97da8b281e5" }

[package]
name = "memehub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
modular-db-api = { path = "crates/modular-db-api" }
meme-github = { path = "crates/meme-github" }
meme-core = { path = "crates/meme-core" }
meme-cli = { path = "crates/meme-cli" }
meme-web = { path = "crates/meme-web" }

[profile.release]
strip = true
lto = "thin"
